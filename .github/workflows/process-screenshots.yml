name: Process screenshots

on:
  push:
    branches: [main]
    paths:
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: process-screenshots
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow numpy

      - name: Split screenshots and rebuild stats/indexes
        run: python scripts/process.py

      - name: Open pull request with the changes
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: split screenshots and update stats"
          branch: bot/process-screenshots
          delete-branch: true
          title: "Process screenshots and update stats"
          body: "Automated update from the screenshot bot."
          labels: bot

      - name: Turn on auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
